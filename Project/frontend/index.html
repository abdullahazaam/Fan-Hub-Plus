    <script>
      (function() {
        try {
          var t = localStorage.getItem('fhp_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var f = localStorage.getItem('fhp_font_size') || 'normal';
          document.documentElement.setAttribute('data-font-size', f);
